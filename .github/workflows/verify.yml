name: Verify native knowledge snapshot
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s tests -v
      - run: python -O -m unittest discover -s tests -p test_validate_snapshot.py -v
      - run: cargo fmt -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python tools/build_reviewed_bundle.py
      - run: git diff --exit-code -- data/reviewed-bundle.json
      - run: cargo run --locked --example seed_reviewed_bundle -- verified.sqlite
      - run: cargo run --locked --example seed_reviewed_bundle -- --sims4-creator-relationships sims4-creator.sqlite
      - run: python -m unittest discover -s tests -p test_sims4_creator_sidecar.py -v
        env:
          SIMS4_CREATOR_SQLITE: sims4-creator.sqlite
      - run: python tools/validate_snapshot.py verified.sqlite
      - run: cargo run --locked --example query -- verified.sqlite modrinth:project:AANobbMI
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-${{ matrix.os }}
          path: verified.sqlite

      - name: Build a separate reviewed Sims 4 archive sidecar
        run: cargo run --locked --example seed_reviewed_bundle -- --scumbumbo-sims4 scumbumbo-sims4.sqlite
      - name: Verify exact SQLite rows, source paths and archive status scope
        run: python -m unittest discover -s tests -p test_scumbumbo_seed.py -v
      - name: Build and verify the independent Cyberpunk 2077 release sidecar
        run: |
          cargo run --locked --example seed_reviewed_bundle -- --cyberpunk2077-core cyberpunk2077-core.sqlite
          python -m unittest discover -s tests -p test_cyberpunk2077_sidecar.py -v
        env:
          CYBERPUNK2077_SQLITE: cyberpunk2077-core.sqlite
      - name: Build and verify the independent Hytale file-channel sidecar
        run: |
          cargo run --locked --example seed_reviewed_bundle -- --hytale-file-channels hytale-file-channels.sqlite
          python -m unittest discover -s tests -p test_hytale_file_channels.py -v
        env:
          HYTALE_CHANNEL_SQLITE: hytale-file-channels.sqlite
      - name: Build and verify the independent Skyrim native runtime sidecar
        run: |
          cargo run --locked --example seed_reviewed_bundle -- --skyrim-native-runtime skyrim-native-runtime.sqlite
          python -m unittest discover -s tests -p test_skyrim_native_runtime.py -v
        env:
          SKYRIM_RUNTIME_SQLITE: skyrim-native-runtime.sqlite
      - name: Verify distributor releases and conditional dependencies in a separate SQLite sidecar
        run: |
          cargo run --locked --example seed_reviewed_bundle -- --skyrim-distributor-releases skyrim-distributor-releases.sqlite
          python -m unittest discover -s tests -p test_skyrim_distributor_release.py -v
        env:
          SKYRIM_DISTRIBUTOR_SQLITE: skyrim-distributor-releases.sqlite
      - name: Verify exact FSMP releases and scoped installer evidence in native SQLite
        run: |
          cargo run --locked --example seed_reviewed_bundle -- --skyrim-fsmp skyrim-fsmp-reviewed.sqlite
          python tools/build_skyrim_fsmp_catalog.py skyrim-fsmp-reviewed.html
          python -m unittest discover -s tests -p test_skyrim_fsmp_evidence.py -v
        env:
          SKYRIM_FSMP_SQLITE: skyrim-fsmp-reviewed.sqlite
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: skyrim-fsmp-reviewed-${{ matrix.os }}
          path: |
            skyrim-fsmp-reviewed.sqlite
            skyrim-fsmp-reviewed.html
          if-no-files-found: error

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Verify source-pinned FSMP legacy MCM transition in native SQLite
        run: |
          cargo run --locked --example seed_reviewed_bundle -- --skyrim-fsmp-mcm-history skyrim-fsmp-mcm-history.sqlite
          python tools/build_skyrim_fsmp_mcm_history.py skyrim-fsmp-mcm-history.html
          python -m unittest discover -s tests -p test_skyrim_fsmp_mcm_history.py -v
          node --test tests/test_skyrim_fsmp_mcm_viewer.mjs
        env:
          SKYRIM_FSMP_MCM_HISTORY_SQLITE: skyrim-fsmp-mcm-history.sqlite
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: skyrim-fsmp-mcm-history-${{ matrix.os }}
          path: |
            skyrim-fsmp-mcm-history.sqlite
            skyrim-fsmp-mcm-history.html
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: skyrim-distributor-releases-${{ matrix.os }}
          path: skyrim-distributor-releases.sqlite
      - name: Keep FLM original, community and NG evidence separate in native SQLite
        run: |
          cargo run --locked --example seed_reviewed_bundle -- --skyrim-flm skyrim-flm.sqlite
          python tools/build_skyrim_flm_review.py skyrim-flm.html
          python -m unittest discover -s tests -p test_skyrim_flm_evidence.py -v
        env:
          SKYRIM_FLM_SQLITE: skyrim-flm.sqlite
          SKYRIM_FLM_HTML: skyrim-flm.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: skyrim-flm-reviewed-${{ matrix.os }}
          path: |
            skyrim-flm.sqlite
            skyrim-flm.html
          if-no-files-found: error
