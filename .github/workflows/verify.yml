name: Verify native knowledge snapshot
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python tools/build_reviewed_bundle.py
      - run: git diff --exit-code -- data/reviewed-bundle.json
      - run: cargo run --locked --example seed_reviewed_bundle -- verified.sqlite
      - run: python tools/validate_snapshot.py verified.sqlite
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-${{ matrix.os }}
          path: verified.sqlite
