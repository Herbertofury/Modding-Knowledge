name: Verify native knowledge snapshot
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s tests -v
      - run: python -O -m unittest discover -s tests -p test_validate_snapshot.py -v
      - run: cargo fmt -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python tools/build_reviewed_bundle.py
      - run: git diff --exit-code -- data/reviewed-bundle.json
      - run: cargo run --locked --example seed_reviewed_bundle -- verified.sqlite
      - run: python tools/validate_snapshot.py verified.sqlite
      - run: cargo run --locked --example query -- verified.sqlite modrinth:project:AANobbMI
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-${{ matrix.os }}
          path: verified.sqlite
      - name: Build own portable manager candidate
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: cargo build --locked --release --bin knowledge-manager
      - name: Package and exercise the extracted manager outside the checkout
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: python tools/package_manager_candidate.py --binary target/release/knowledge-manager${{ runner.os == 'Windows' && '.exe' || '' }} --snapshot verified.sqlite --output modding-knowledge-portable.zip --commit ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: modding-knowledge-portable-${{ matrix.os }}
          path: modding-knowledge-portable.zip
          if-no-files-found: error
          retention-days: 14
