name: Verify native knowledge snapshot
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s tests -v
      - run: python -O -m unittest discover -s tests -p test_validate_snapshot.py -v
      - run: cargo fmt -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python tools/build_reviewed_bundle.py
      - run: git diff --exit-code -- data/reviewed-bundle.json
      - run: cargo run --locked --example seed_reviewed_bundle -- verified.sqlite
      - run: python tools/validate_snapshot.py verified.sqlite
      - run: cargo run --locked --example query -- verified.sqlite modrinth:project:AANobbMI
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-${{ matrix.os }}
          path: verified.sqlite
      - name: Verify the optional Morrowind engine sidecar
        run: cargo run --locked --example seed_reviewed_bundle -- --morrowind-engine-tracks morrowind-engine-tracks.sqlite
      - name: Inspect reviewed Morrowind source observations
        run: cargo run --locked --example query -- morrowind-engine-tracks.sqlite morrowind:project:openmw
      - uses: actions/upload-artifact@v4
        with:
          name: morrowind-engine-tracks-${{ matrix.os }}
          path: morrowind-engine-tracks.sqlite
          if-no-files-found: error
      - name: Verify the optional Oblivion and Remastered sidecar
        run: cargo run --locked --example seed_reviewed_bundle -- --oblivion-runtime-tracks oblivion-runtime-tracks.sqlite
      - name: Inspect reviewed Oblivion Remastered source observations
        run: cargo run --locked --example query -- oblivion-runtime-tracks.sqlite oblivion-remastered:project:obse64
      - uses: actions/upload-artifact@v4
        with:
          name: oblivion-runtime-tracks-${{ matrix.os }}
          path: oblivion-runtime-tracks.sqlite
          if-no-files-found: error
      - name: Verify the Arena and Daggerfall sidecar
        run: cargo run --locked --example seed_reviewed_bundle -- --early-tes-engine-tracks early-tes-engine-tracks.sqlite
      - name: Inspect both reviewed early TES engine projects
        run: |
          cargo run --locked --example query -- early-tes-engine-tracks.sqlite daggerfall-unity:project:dfu
          cargo run --locked --example query -- early-tes-engine-tracks.sqlite arena:project:opentesarena
      - uses: actions/upload-artifact@v4
        with:
          name: early-tes-engine-tracks-${{ matrix.os }}
          path: early-tes-engine-tracks.sqlite
          if-no-files-found: error
