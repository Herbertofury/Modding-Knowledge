name: Source preservation experiment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/source-preservation/**'
      - '.github/workflows/source-preservation.yml'
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path experiments/source-preservation/Cargo.toml
